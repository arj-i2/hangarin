{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Hangarin{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'tasks/css/style.css' %}">
</head>

<body>

<div class="layout">

    <aside class="sidebar">
        <div class="logo">Hangarin</div>

        <a href="{% url 'task-list' %}">Dashboard</a>
        <a href="{% url 'task-list' %}">Tasks</a>
    </aside>

    <main class="main">

        <header class="topbar">
            <h2>{% block header %}My Tasks{% endblock %}</h2>

            <a href="{% url 'task-create' %}" class="create-button">
                + Create Task
            </a>
        </header>

        <section class="content">

            <div class="search-box">
                <form method="get">
                    <input
                        type="text"
                        name="search"
                        placeholder="Search tasks..."
                        value="{{ request.GET.search|default:'' }}"
                    >

                    <button type="submit">Search</button>
                </form>
            </div>

            {% block content %}
            {% endblock %}

        </section>

    </main>

</div>

</body>
</html>
