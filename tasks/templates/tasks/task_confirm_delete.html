{% extends "tasks/base.html" %}

{% block content %}

<h1>Delete Task</h1>

<p>Are you sure you want to delete "{{ object.title }}"?</p>

<form method="post">
    {% csrf_token %}

    <button type="submit">Yes, Delete</button>
    <a href="{% url 'task-detail' object.pk %}">Cancel</a>
</form>

{% endblock %}
